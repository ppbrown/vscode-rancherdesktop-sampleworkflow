apiVersion: apps/v1
kind: Deployment
metadata:
  name: k-app
  labels:
    app.kubernetes.io/name: k-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: k-app
          # DevSpace rewrites this to the freshly built tag; CI would do the same.
          image: k-app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GREETING
              value: "Hello from k-app on Kubernetes"
            - name: APP_VERSION
              value: "0.1.0"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
